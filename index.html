<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CBT Panesa - SMP Negeri 1 Pabedilan</title>
    
    <!-- PWA & ICON SETTINGS -->
    <meta name="theme-color" content="#0b0f19">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="Panesa-removebg-preview.png" type="image/png">
    <link rel="apple-touch-icon" href="Panesa-removebg-preview.png">
    
    <!-- Embedded PWA Manifest -->
    <link rel="manifest" href='data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22CBT%20PANESA%22%2C%22short_name%22%3A%22CBT%20Panesa%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23070913%22%2C%22theme_color%22%3A%22%236366f1%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22Panesa-removebg-preview.png%22%2C%22sizes%22%3A%22192x192%20512x512%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D'>
    
    <!-- LOGO SETTINGS -->
    <script>
        window.PANESA_LOGO = "Panesa-removebg-preview.png";
        window.KAB_CIREBON_LOGO = "data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 240'%3E%3Cpath d='M100 10 L185 45 C185 160 100 225 100 225 C100 225 15 160 15 45 Z' fill='%2315803d' stroke='%23eab308' stroke-width='6' stroke-linejoin='round'/%3E%3Cpath d='M100 20 L173 51 C173 150 100 210 100 210 C100 210 27 150 27 51 Z' fill='%231e3a8a'/%3E%3Cpath d='M100 40 L160 70 L100 190 L40 70 Z' fill='%23f59e0b' stroke='%23ffffff' stroke-width='2'/%3E%3Ccircle cx='100' cy='105' r='30' fill='%230284c7' stroke='%23ffffff' stroke-width='3'/%3E%3Cpolygon points='100,80 107,95 123,96 110,107 115,123 100,113 85,123 90,107 77,96 93,95' fill='%23facc15'/%3E%3Cpath d='M35 180 Q100 160 165 180 L155 200 Q100 180 45 200 Z' fill='%23dc2626' stroke='%23ffffff' stroke-width='1.5'/%3E%3Ctext x='100' y='194' font-family='Arial, sans-serif' font-weight='900' font-size='11' fill='%23ffffff' text-anchor='middle'%3EKAB. CIREBON%3C/text%3E%3C/svg%3E";
    </script>

    <!-- LIBRARIES via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap');
        
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #070913; color: #f1f5f9; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; }
        body.admin-mode { -webkit-user-select: text; -moz-user-select: text; -ms-user-select: text; user-select: text; }
        .font-heading { font-family: 'Outfit', sans-serif; }
        .admin-nav-item { font-family: 'Outfit', sans-serif; font-weight: 700; letter-spacing: 0.02em; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
        .vibrant-login-bg { background: linear-gradient(135deg, #090d16 0%, #171c30 40%, #29153d 80%, #3f1140 100%); position: relative; overflow: hidden; }
        .vibrant-login-bg::before { content: ''; position: absolute; width: 700px; height: 700px; background: radial-gradient(circle, rgba(99, 102, 241, 0.35) 0%, rgba(139, 92, 246, 0.05) 70%); top: -250px; left: -250px; border-radius: 50%; animation: floatOrb 12s ease-in-out infinite alternate; }
        .vibrant-login-bg::after { content: ''; position: absolute; width: 700px; height: 700px; background: radial-gradient(circle, rgba(236, 72, 153, 0.3) 0%, rgba(59, 130, 246, 0.05) 70%); bottom: -250px; right: -250px; border-radius: 50%; animation: floatOrb 15s ease-in-out infinite alternate-reverse; }
        @keyframes floatOrb { 0% { transform: translateY(0) scale(1) rotate(0deg); } 100% { transform: translateY(60px) scale(1.2) rotate(15deg); } }
        .glow-bg { background: radial-gradient(circle at 50% 20%, rgba(99, 102, 241, 0.15), transparent 60%), radial-gradient(circle at 80% 80%, rgba(236, 72, 153, 0.12), transparent 50%), radial-gradient(circle at 10% 90%, rgba(16, 185, 129, 0.12), transparent 50%); }
        .glass-card-dark { background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.12); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); }
        .glass-input { background: rgba(30, 41, 59, 0.85); border: 1px solid rgba(255, 255, 255, 0.15); color: #f8fafc; transition: all 0.3s ease; }
        .glass-input:focus { background: rgba(30, 41, 59, 0.98); border-color: #6366f1; box-shadow: 0 0 25px rgba(99, 102, 241, 0.35); outline: none; }
        .gradient-btn { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #d946ef 100%); background-size: 200% 200%; animation: gradientShift 6s ease infinite; transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .gradient-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.6); }
        @keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .loader-ring { display: inline-block; position: relative; width: 80px; height: 80px; }
        .loader-ring div { box-sizing: border-box; display: block; position: absolute; width: 64px; height: 64px; margin: 8px; border: 8px solid #6366f1; border-radius: 50%; animation: loader-ring 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite; border-color: #6366f1 transparent transparent transparent; }
        .loader-ring div:nth-child(1) { animation-delay: -0.45s; }
        .loader-ring div:nth-child(2) { animation-delay: -0.3s; }
        .loader-ring div:nth-child(3) { animation-delay: -0.15s; }
        @keyframes loader-ring { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>

    <script>
        document.addEventListener('contextmenu', event => {
            if (window.currentUser && window.currentUser.role === 'admin') return true;
            event.preventDefault();
        });

        window.togglePassword = function(fieldId, btnEl) {
            const input = document.getElementById(fieldId); if (!input) return;
            const icon = btnEl.querySelector('i');
            if (input.type === 'password') { input.type = 'text'; if (icon) icon.className = 'fa-solid fa-eye-slash'; } 
            else { input.type = 'password'; if (icon) icon.className = 'fa-solid fa-eye'; }
        };

        window.globalSettings = {
            logoUrl: window.PANESA_LOGO, logoKiri: window.KAB_CIREBON_LOGO, pemkab: "PEMERINTAH KABUPATEN CIREBON", dinas: "DINAS PENDIDIKAN",
            namaSekolah: "SMP NEGERI 1 PABEDILAN", alamatSekolah: "Jl. Mayjen Sutoyo No. 159 Pabedilankulon Kec. Pabedilan",
            kodePos: "45193", namaKasek: "Kepala Sekolah, M.Pd.", nipKasek: "196501011988031005",
            namaPanitia: "Nama Ketua Panitia, S.Pd.", nipPanitia: "198001012005011001",
            namaSekretaris: "Nama Sekretaris, S.Pd.", nipSekretaris: "198501012009012002",
            tahunPelajaran: "2026/2027", supabaseUrl: "", supabaseKey: "", useSupabase: false
        };

        window.appData = { soal: [], peserta: [], jadwal: [], hasil: [], beritaAcara: [], pengawas: [] };
        window.currentUser = null; window.currentQuestionIndex = 0; window.dashboardInterval = null;
        window.studentAnswers = {}; window.studentRagu = {}; window.examTimerInterval = null; window.currentRoute = 'login';
        window.violationCount = 0; window.isExamActive = false; window.supabaseClient = null;
        window.isCanvasSigned = false;
        window.listMapel = ['Pendidikan Agama dan Budi Pekerti', 'Pendidikan Pancasila', 'Bahasa Indonesia', 'Matematika', 'IPA', 'IPS', 'Bahasa Inggris', 'PJOK', 'Informatika', 'SBdP', 'Bahasa Sunda'];

        window.saveLocalData = async function(key) { 
            localStorage.setItem('cbt_data_' + key, JSON.stringify(window.appData[key])); 
            if (window.globalSettings.useSupabase && window.supabaseClient) {
                try { 
                    await window.supabaseClient.from('cbt_panesa_data').upsert({ key: 'cbt_data_' + key, value: window.appData[key] }); 
                } catch(e) { console.error("Gagal sinkron ke Supabase:", e); }
            }
        };

        window.generateId = function() { return Date.now().toString(36) + Math.random().toString(36).substring(2, 7); };
        window.generateRandomToken = function() { const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let res = ''; for (let i = 0; i < 6; i++) res += chars.charAt(Math.floor(Math.random() * chars.length)); return res; };
        
        window.generateRandomPassword = function() { 
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'; 
            let res = ''; 
            for (let i = 0; i < 6; i++) res += chars.charAt(Math.floor(Math.random() * chars.length)); 
            return res; 
        };

        window.updateLogoDisplay = function() {
            const l1 = document.getElementById('app-logo-display'); if (l1) l1.src = window.globalSettings.logoUrl;
            const l2 = document.getElementById('mobile-logo-display'); if (l2) l2.src = window.globalSettings.logoUrl;
            const l3 = document.getElementById('sidebar-logo-display'); if (l3) l3.src = window.globalSettings.logoUrl;
        };

        window.updateAppHeaderTitles = function() {
            const h = document.getElementById('sidebar-user-name');
            if (h) h.innerText = window.globalSettings.namaSekolah;
        };

        async function initApp() {
            const localSettings = localStorage.getItem('cbt_global_settings');
            if (localSettings) {
                try { 
                    window.globalSettings = { ...window.globalSettings, ...JSON.parse(localSettings) }; 
                } catch(e) {}
            }

            if (window.globalSettings.useSupabase && window.globalSettings.supabaseUrl && window.globalSettings.supabaseKey) {
                window.supabaseClient = supabase.createClient(window.globalSettings.supabaseUrl, window.globalSettings.supabaseKey);
                try {
                    const { data, error } = await window.supabaseClient.from('cbt_panesa_data').select('*');
                    if (!error && data && data.length > 0) {
                        data.forEach(row => {
                            if (row.key === 'cbt_global_settings') {
                                window.globalSettings = { ...window.globalSettings, ...row.value };
                                localStorage.setItem('cbt_global_settings', JSON.stringify(window.globalSettings));
                            } else {
                                const key = row.key.replace('cbt_data_', '');
                                window.appData[key] = row.value;
                                localStorage.setItem(row.key, JSON.stringify(row.value));
                            }
                        });
                    } else { initMockDataIfEmpty(); }
                } catch(err) { console.error("Gagal tarik data dari Supabase", err); initMockDataIfEmpty(); }
            } else {
                initMockDataIfEmpty();
            }

            const selectRuang = document.getElementById('pengawas-ruang');
            if (selectRuang) selectRuang.innerHTML = window.populateRuangOptions();

            document.getElementById('loading-overlay').classList.add('hidden');
            window.updateLogoDisplay();
            window.updateAppHeaderTitles();
            
            const savedSession = sessionStorage.getItem('cbt_session');
            if (savedSession) {
                window.currentUser = JSON.parse(savedSession);
                if (window.currentUser.role === 'siswa') window.loadSiswaSelectMapelView(true);
                else initAppSession(true);
            } else { history.replaceState({page: 'login'}, '', '#login'); }
        }

        function initMockDataIfEmpty() {
            let hasData = false;
            ['soal', 'peserta', 'jadwal', 'hasil', 'beritaAcara', 'pengawas'].forEach(key => {
                const stored = localStorage.getItem('cbt_data_' + key);
                if (stored) { window.appData[key] = JSON.parse(stored); hasData = true; }
            });
            if (!hasData) {
                window.appData.peserta = [{ id: window.generateId(), username: "101", nama: "Siswa Dummy", tingkat: "7", kelas: "7A", password: "A7K9M2", status_blokir: "AKTIF" }];
                window.appData.pengawas = [{ id: window.generateId(), nama: "Budi Santoso", nip: "19800101", ruang: "Ruang 001", password: "123" }];
                window.appData.soal = [{ id: window.generateId(), jenis: "PG", tingkat: "7", mapel: "Bahasa Indonesia", pertanyaan: "Contoh Pertanyaan?", pilihan_a: "A", pilihan_b: "B", pilihan_c: "C", pilihan_d: "D", kunci: "A", skor: 10 }];
                window.appData.jadwal = [{ id: window.generateId(), tingkat: "7", mapel: "Bahasa Indonesia", durasi: 90, status: "Aktif", hari: "Senin", tanggal: new Date().toISOString().split('T')[0], token: "ABCD12" }];
                window.saveLocalData('peserta'); window.saveLocalData('pengawas'); window.saveLocalData('soal'); window.saveLocalData('jadwal');
            }
        }

        let wakeLock = null;
        window.requestWakeLock = async function() { try { if ('wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => {}); } } catch (err) {} };
        window.releaseWakeLock = function() { if (wakeLock !== null) { wakeLock.release().then(() => { wakeLock = null; }); } };

        document.addEventListener('visibilitychange', function() {
            if (document.hidden && window.isExamActive && window.currentUser && window.currentUser.role === 'siswa') {
                window.violationCount++;
                if (window.violationCount >= 4) {
                    window.blockStudentDueToViolation();
                } else {
                    window.showNotification(`⚠️ PERINGATAN PELANGGARAN ke-${window.violationCount}! Jangan beralih aplikasi. Jika mencapai 4 kali, Anda akan dikeluarkan dari ujian!`);
                }
            }
            if (!document.hidden && window.isExamActive && wakeLock === null) window.requestWakeLock();
        });

        window.populateRuangOptions = function() {
            let options = ''; for (let i = 1; i <= 31; i++) { const r = 'Ruang ' + String(i).padStart(3, '0'); options += `<option value="${r}">${r}</option>`; }
            options += `<option value="Ruang Labkom">Ruang Labkom</option>`; return options;
        };

        window.showConfirm = function(message, onConfirm) {
            let modal = document.getElementById('confirm-modal'); if (!modal) { modal = document.createElement('div'); modal.id = 'confirm-modal'; document.body.appendChild(modal); }
            modal.className = 'fixed inset-0 z-[300] flex items-center justify-center bg-slate-900/80 p-4 backdrop-blur-md';
            modal.innerHTML = `
                <div class="glass-card-dark p-6 rounded-3xl max-w-sm w-full border border-slate-700 shadow-2xl text-center space-y-4">
                    <div class="w-14 h-14 bg-amber-500/20 text-amber-400 rounded-full flex items-center justify-center mx-auto text-2xl"><i class="fa-solid fa-triangle-exclamation"></i></div>
                    <p class="text-[11px] text-slate-200 font-semibold tracking-wide">${message}</p>
                    <div class="flex gap-2 pt-2"><button id="confirm-btn-cancel" class="flex-1 py-1.5 bg-slate-800 text-slate-300 rounded-xl text-[10px] font-bold uppercase hover:bg-slate-700 transition tracking-wider">Batal</button><button id="confirm-btn-ok" class="flex-1 py-1.5 bg-red-600 hover:bg-red-500 text-white rounded-xl text-[10px] font-bold uppercase transition tracking-wider">Ya, Lanjutkan</button></div>
                </div>
            `;
            modal.classList.remove('hidden');
            document.getElementById('confirm-btn-cancel').onclick = () => modal.classList.add('hidden');
            document.getElementById('confirm-btn-ok').onclick = () => { modal.classList.add('hidden'); if (typeof onConfirm === 'function') onConfirm(); };
        };

        window.showPasswordConfirm = function(message, onConfirm) {
            let modal = document.getElementById('confirm-modal'); if (!modal) { modal = document.createElement('div'); modal.id = 'confirm-modal'; document.body.appendChild(modal); }
            modal.className = 'fixed inset-0 z-[300] flex items-center justify-center bg-slate-900/80 p-4 backdrop-blur-md';
            modal.innerHTML = `
                <div class="glass-card-dark p-6 rounded-3xl max-w-sm w-full border border-slate-700 shadow-2xl text-center space-y-4">
                    <div class="w-14 h-14 bg-red-500/20 text-red-400 rounded-full flex items-center justify-center mx-auto text-2xl"><i class="fa-solid fa-shield-halved"></i></div>
                    <p class="text-[11px] text-slate-200 font-semibold tracking-wide">${message}</p>
                    <input type="password" id="auth-delete-password" class="w-full p-2.5 glass-input rounded-xl text-center text-sm tracking-widest mt-2 font-mono" placeholder="Password Authority">
                    <div class="flex gap-2 pt-2"><button id="confirm-btn-cancel" class="flex-1 py-1.5 bg-slate-800 text-slate-300 rounded-xl text-[10px] font-bold uppercase hover:bg-slate-700 transition tracking-wider">Batal</button><button id="confirm-btn-ok" class="flex-1 py-1.5 bg-red-600 hover:bg-red-500 text-white rounded-xl text-[10px] font-bold uppercase transition tracking-wider">Hapus Data</button></div>
                </div>
            `;
            modal.classList.remove('hidden'); document.getElementById('auth-delete-password').focus();
            document.getElementById('confirm-btn-cancel').onclick = () => modal.classList.add('hidden');
            document.getElementById('confirm-btn-ok').onclick = () => {
                if (document.getElementById('auth-delete-password').value === 'jirolutek') { modal.classList.add('hidden'); if (typeof onConfirm === 'function') onConfirm(); } 
                else { window.showNotification('Password Authority Salah!'); }
            };
        };

        window.showNotification = function(message) {
            let notif = document.getElementById('toast-notif');
            if (!notif) {
                notif = document.createElement('div'); notif.id = 'toast-notif';
                notif.className = 'fixed top-5 right-5 z-[100] bg-indigo-600 text-white px-5 py-3 rounded-xl shadow-2xl transform transition-all duration-300 -translate-y-20 opacity-0 flex items-center space-x-3 font-bold text-[11px] border border-indigo-500 tracking-wide';
                document.body.appendChild(notif);
            }
            notif.innerHTML = `<i class="fa-solid fa-circle-info text-lg"></i><span>${message}</span>`;
            setTimeout(() => notif.classList.remove('-translate-y-20', 'opacity-0'), 10);
            setTimeout(() => notif.classList.add('-translate-y-20', 'opacity-0'), 4000);
        }

        document.addEventListener('DOMContentLoaded', initApp);

        window.adminActionMap = {
            'nav-dashboard': () => window.loadAdminDashboard(),
            'nav-soal': () => window.loadManajemenSoal('semua'),
            'nav-jadwal': () => window.loadManajemenJadwal(),
            'nav-peserta': () => window.loadDatabasePeserta('7'),
            'nav-pengawas': () => window.loadDataPengawas(),
            'nav-daftar-hadir': () => window.loadDaftarHadir('peserta'),
            'nav-hadir-gabung': () => window.loadHadirDanGabung(),
            'nav-kartu': () => window.loadRuangDanKartu('ruang'),
            'nav-nilai': () => window.loadRekapNilai('semua'),
            'nav-ba': () => window.currentUser.role === 'admin' ? window.loadAdminDaftarBeritaAcara() : window.loadPengawasMode(),
            'nav-pengaturan-sekolah': () => window.loadPengaturanSekolahDanPejabat('sekolah'),
            'nav-tatatertib': () => window.loadTataTertib('peserta'),
            'nav-panduan': () => window.loadPanduan(),
            'nav-supabase': () => window.loadKonfigurasiServer()
        };

        window.adminNavigate = function(navId, isPop = false) {
            if (!isPop) history.pushState({ page: navId }, '', '#' + navId);
            if (window.dashboardInterval) { clearInterval(window.dashboardInterval); window.dashboardInterval = null; }
            if (window.adminActionMap[navId]) window.adminActionMap[navId]();
            window.updateActiveNav(navId);
        };

        window.addEventListener('popstate', function(event) {
            if (window.isExamActive) {
                history.pushState(null, null, location.href);
                window.showNotification("⚠️ Dilarang kembali saat ujian berlangsung!");
            } else if (window.currentUser) {
                if (window.currentUser.role === 'siswa') {
                    if (window.currentRoute === 'siswa-konfirmasi') window.loadSiswaSelectMapelView(true);
                    else if (window.currentRoute === 'siswa-mapel') window.handleLogout(true);
                } else {
                    const state = event.state;
                    if (state && state.page && window.adminActionMap[state.page]) window.adminNavigate(state.page, true);
                    else window.adminNavigate(window.currentUser.role === 'admin' ? 'nav-dashboard' : 'nav-ba', true);
                }
            } else { history.replaceState({page: 'login'}, '', '#login'); }
        });

        window.switchLoginRole = function(role) {
            ['siswa', 'pengawas', 'admin'].forEach(r => {
                document.getElementById(`tab-${r}-btn`).className = "py-2.5 rounded-xl transition-all text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 font-bold uppercase tracking-wider text-[10px]";
                document.getElementById(`${r}-login-form`)?.classList.add('hidden');
            });
            document.getElementById(`tab-${role}-btn`).className = "py-2.5 rounded-xl transition-all bg-indigo-600 text-white shadow-lg font-bold uppercase tracking-wider text-[10px] ring-1 ring-indigo-400/50";
            document.getElementById(`${role}-login-form`)?.classList.remove('hidden');
        }

        window.handleSiswaLogin = function(e) {
            e.preventDefault(); 
            const username = document.getElementById('siswa-nomor').value.trim();
            const password = document.getElementById('siswa-password').value.trim();
            const foundPeserta = window.appData.peserta.find(p => p.username === username);
            if (!foundPeserta) { showNotification('Username tidak ditemukan di Database!'); return; }
            
            const dbPassword = foundPeserta.password;
            if (dbPassword) { if (password !== dbPassword) { showNotification('Password salah!'); return; } } 
            else { if (password !== "123456" && password !== username) { showNotification('Password salah!'); return; } }

            if (String(foundPeserta.status_blokir || 'AKTIF').toUpperCase() === 'BLOKIR') { showNotification('AKUN ANDA DIBLOKIR!'); return; }

            if (foundPeserta.status_login === 'AKTIF') {
                showNotification('Akun sedang AKTIF di perangkat lain! Lapor Pengawas untuk mereset akun Anda.');
                return;
            }
            
            foundPeserta.status_login = 'AKTIF';
            window.saveLocalData('peserta');

            window.currentUser = { nomor: username, nama: foundPeserta.nama, tingkat: foundPeserta.tingkat, kelas: foundPeserta.kelas, role: 'siswa' };
            sessionStorage.setItem('cbt_session', JSON.stringify(window.currentUser));
            window.violationCount = 0; window.loadSiswaSelectMapelView();
        }

        window.handlePengawasLogin = function(e) { 
            e.preventDefault(); 
            const n = document.getElementById('pengawas-nama').value.trim();
            const pw = document.getElementById('pengawas-password').value.trim();
            if (pw !== "123") { showNotification('Password Pengawas Salah! Default: 123'); return; }

            window.currentUser = { nama: n, ruang: document.getElementById('pengawas-ruang').value, role: 'pengawas' }; 
            sessionStorage.setItem('cbt_session', JSON.stringify(window.currentUser)); initAppSession(); 
        }
        
        window.handleAdminLogin = function(e) { 
            e.preventDefault(); 
            if (document.getElementById('admin-username').value.trim() === "admin" && document.getElementById('admin-password').value === "123tek") { 
                window.currentUser = { nama: "Administrator", role: "admin" }; sessionStorage.setItem('cbt_session', JSON.stringify(window.currentUser)); initAppSession(); 
            } else { showNotification('Username/Password salah!'); } 
        }

        window.handleLogout = function(isPopState = false) {
            if (window.currentUser && window.currentUser.role === 'siswa') {
                let idx = window.appData.peserta.findIndex(p => p.username === window.currentUser.nomor);
                if (idx > -1) {
                    window.appData.peserta[idx].status_login = 'OFFLINE';
                    window.saveLocalData('peserta');
                }
            }

            sessionStorage.removeItem('cbt_session');
            window.currentUser = null; window.isExamActive = false; 
            if(window.examTimerInterval) clearInterval(window.examTimerInterval);
            if(window.dashboardInterval) clearInterval(window.dashboardInterval);
            window.releaseWakeLock();
            
            window.currentRoute = 'login'; document.getElementById('main-app').classList.add('hidden'); document.getElementById('login-view').classList.remove('hidden');
            document.getElementById('sidebar').classList.add('hidden'); document.getElementById('sidebar').classList.remove('md:flex'); document.getElementById('mobile-header').classList.add('hidden');
            document.body.classList.remove('admin-mode');
            document.getElementById('siswa-login-form').reset(); document.getElementById('pengawas-login-form').reset(); document.getElementById('admin-login-form').reset(); window.switchLoginRole('siswa');
            if (isPopState !== true) history.pushState({page: 'login'}, '', '#login');
        }

        window.toggleMobileSidebar = function() {
            const sidebar = document.getElementById('sidebar'); const overlay = document.getElementById('mobile-sidebar-overlay');
            if (sidebar.classList.contains('-translate-x-full')) { sidebar.classList.remove('-translate-x-full'); overlay.classList.remove('hidden'); } 
            else { sidebar.classList.add('-translate-x-full'); overlay.classList.add('hidden'); }
        }

        function initAppSession(isInitialLoad = false) {
            document.getElementById('login-view').classList.add('hidden'); document.getElementById('main-app').classList.remove('hidden');
            
            if (window.currentUser && window.currentUser.role === 'admin') {
                document.body.classList.add('admin-mode');

                            cloudData.forEach(row => {
                                if (row.key === 'cbt_global_settings') {
                                    window.globalSettings = { ...window.globalSettings, ...row.value };
                                    localStorage.setItem('cbt_global_settings', JSON.stringify(window.globalSettings));

                                    const key = row.key.replace('cbt_data_', ''); window.appData[key] = row.value;

                        <div class="w-14 h-14 bg-gradient-to-tr from-indigo-600 to-pink-600 text-white rounded-2xl flex items-center justify-center text-3xl shadow-lg shrink-0 animate-bounce">👋</div>
                        <div><h2 class="text-lg font-black text-white font-heading tracking-tight">Selamat Datang Bapak Ibu Guru Hebat di Aplikasi CBT PANESA</h2><p class="text-[11px] text-indigo-300 mt-1 font-medium tracking-wide">Kelola ujian sekolah dengan lancar, aman, dan efisien hari ini.</p></div>

                        <div class="glass-card-dark p-5 rounded-3xl border border-slate-800 flex items-center space-x-4 shadow-lg"><div class="w-12 h-12 bg-amber-500/10 text-amber-400 rounded-2xl flex items-center justify-center text-xl"><i class="fa-solid fa-laptop-code"></i></div><div><p class="text-[9px] font-bold text-slate-400 uppercase tracking-wider">Aktif Mengerjakan</p><h3 class="text-xl font-black text-amber-400 mt-0.5 tracking-tight">${totalAktif}</h3></div></div>

        // --- MANAJEMEN SOAL ---
        window.loadManajemenSoal = function(filterTingkat = window.currentFilterTingkat || 'semua', forceRefresh = false, filterMapel = window.currentFilterMapel || 'semua') {
            window.currentRoute = 'soal'; window.currentFilterTingkat = filterTingkat; window.currentFilterMapel = filterMapel;
            let soalData = filterTingkat === 'semua' ? window.appData.soal : window.appData.soal.filter(s => String(s.tingkat) === filterTingkat);
            const container = document.getElementById('content-container'); if (!container) return;
            
            let html = `
                <div class="mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div><h1 class="text-2xl font-black text-white font-heading tracking-tight">Soal Ujian</h1><p class="text-[11px] text-slate-400 mt-1 tracking-wide">Kelola Daftar Pertanyaan</p></div>
                    <div class="flex gap-2 flex-wrap">
                        <button onclick="window.openNewSoalModal()" class="px-2.5 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-lg text-[10px] uppercase tracking-wider shadow-md"><i class="fa-solid fa-plus mr-1"></i> Tambah</button>
                        <button onclick="window.downloadExcelTemplateSoal()" class="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold rounded-lg text-[10px] uppercase tracking-wider shadow-md"><i class="fa-solid fa-download mr-1"></i> Template</button>
                        <button onclick="document.getElementById('excel-soal-input').click()" class="px-2.5 py-1.5 gradient-btn text-white font-bold rounded-lg text-[10px] uppercase tracking-wider shadow-md"><i class="fa-solid fa-upload mr-1"></i> Import</button>
                        <input type="file" id="excel-soal-input" accept=".xlsx, .xls" class="hidden" onchange="window.handleExcelImportSoal(event)">
                    </div>
                </div>
                <div class="flex gap-2 mb-5 text-[11px] font-bold overflow-x-auto pb-2">
                    <button onclick="window.loadManajemenSoal('semua', false, 'semua')" class="px-2.5 py-1 rounded-lg transition shrink-0 tracking-wider text-[10px] ${filterTingkat === 'semua' ? 'bg-indigo-600 text-white' : 'bg-slate-900 text-slate-400 hover:text-white'}">Semua Kelas</button>
                    <button onclick="window.loadManajemenSoal('7', false, 'semua')" class="px-2.5 py-1 rounded-lg transition shrink-0 tracking-wider text-[10px] ${filterTingkat === '7' ? 'bg-indigo-600 text-white' : 'bg-slate-900 text-slate-400 hover:text-white'}">Kelas 7</button>
                    <button onclick="window.loadManajemenSoal('8', false, 'semua')" class="px-2.5 py-1 rounded-lg transition shrink-0 tracking-wider text-[10px] ${filterTingkat === '8' ? 'bg-indigo-600 text-white' : 'bg-slate-900 text-slate-400 hover:text-white'}">Kelas 8</button>
                    <button onclick="window.loadManajemenSoal('9', false, 'semua')" class="px-2.5 py-1 rounded-lg transition shrink-0 tracking-wider text-[10px] ${filterTingkat === '9' ? 'bg-indigo-600 text-white' : 'bg-slate-900 text-slate-400 hover:text-white'}">Kelas 9</button>
                </div>
            `;

            if (window.currentFilterMapel === 'semua') {
                html += `<div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">`;
                window.listMapel.forEach(mapel => {
                    let count = soalData.filter(s => s.mapel === mapel).length;
                    html += `<div onclick="window.loadManajemenSoal('${filterTingkat}', false, '${mapel}')" class="glass-card-dark p-4 rounded-2xl border border-slate-700 hover:border-indigo-500 cursor-pointer transition group shadow-lg text-center flex flex-col items-center justify-center space-y-2"><div class="w-10 h-10 bg-indigo-500/10 text-indigo-400 group-hover:bg-indigo-500 group-hover:text-white rounded-xl flex items-center justify-center text-xl transition transform group-hover:scale-110"><i class="fa-solid fa-folder-open"></i></div><div><h3 class="font-bold text-white text-[10px] font-heading group-hover:text-indigo-300 transition tracking-tight">${mapel}</h3><p class="text-[9px] font-bold tracking-wider ${count > 0 ? 'text-emerald-400' : 'text-slate-500'} mt-0.5">${count} Soal</p></div></div>`;
                });
                html += `</div>`;
            } else {
                let filteredSoal = soalData.filter(s => s.mapel === window.currentFilterMapel);
                html += `<div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-4 bg-slate-900 p-3 rounded-2xl border border-slate-800"><div class="flex items-center space-x-3"><button onclick="window.loadManajemenSoal('${filterTingkat}', false, 'semua')" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-[10px] font-bold uppercase tracking-wider transition"><i class="fa-solid fa-arrow-left mr-1"></i>Kembali</button><h2 class="font-bold text-indigo-300 text-[11px] tracking-wide"><i class="fa-solid fa-folder-open mr-1"></i> ${window.currentFilterMapel}</h2></div><div class="flex gap-2 flex-wrap"><button onclick="window.hapusSoalTerpilih()" id="btn-hapus-soal" class="hidden px-2.5 py-1 bg-red-600 hover:bg-red-500 text-white font-bold rounded-lg text-[10px] uppercase tracking-wider shadow-md transition">Hapus (<span id="count-soal-terpilih">0</span>)</button><button onclick="window.hapusSemuaSoalMapel('${window.currentFilterMapel}')" class="px-2.5 py-1 bg-red-600/80 hover:bg-red-500 text-white font-bold rounded-lg text-[10px] uppercase tracking-wider shadow-md transition">Kosongkan Folder</button></div></div>`;
                if (filteredSoal.length === 0) { html += `<div class="glass-card-dark p-8 rounded-2xl text-center text-slate-400 font-medium text-[11px]">Folder ini masih kosong.</div>`; } 
                else {
                    html += `<div class="space-y-4"><div class="flex items-center px-3 mb-2 bg-slate-900/50 p-2.5 rounded-xl border border-slate-800"><input type="checkbox" onchange="window.toggleAllSoal(event)" class="cursor-pointer accent-indigo-500 w-3.5 h-3.5 rounded mr-3"><span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Pilih Semua Soal</span></div>`;
                    filteredSoal.forEach((s, idx) => {
                        const kArr = (s.kunci || 'A').split(',');
                        html += `
                            <div class="glass-card-dark p-4 rounded-2xl border border-slate-800 relative group flex gap-4"><div class="pt-1"><input type="checkbox" class="chk-soal cursor-pointer accent-indigo-500 w-3.5 h-3.5 rounded" value="${s.id}" onchange="window.updateBtnHapusSoalTerpilih()"></div><div class="flex-1"><div class="flex justify-between items-start gap-3 mb-2"><span class="px-2 py-0.5 bg-indigo-500/20 text-indigo-300 rounded text-[9px] font-extrabold uppercase tracking-widest">Kelas ${s.tingkat} • ${s.jenis==='PGK'?'PGK':s.jenis==='BS'?'B/S':'PG'}</span><div class="flex items-center space-x-1"><button onclick="window.viewSoalModal('${s.id}')" class="px-2 py-1 bg-sky-500/10 text-sky-400 hover:bg-sky-500/20 text-[9px] font-bold uppercase rounded transition shadow"><i class="fa-solid fa-eye"></i></button><button onclick="window.openEditSoalModal('${s.id}')" class="px-2 py-1 bg-amber-500/10 text-amber-400 hover:bg-amber-500/20 text-[9px] font-bold uppercase rounded transition shadow"><i class="fa-solid fa-pen"></i></button><button onclick="window.hapusSoal('${s.id}')" class="px-2 py-1 bg-red-500/10 text-red-400 hover:bg-red-500/20 text-[9px] font-bold uppercase rounded transition shadow"><i class="fa-solid fa-trash"></i></button></div></div><p class="text-[11px] text-slate-200 font-semibold mb-3 leading-relaxed">${idx+1}. ${s.pertanyaan}</p><div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-[11px]">
                                <div class="p-2 rounded-lg ${kArr.includes('A')?'bg-emerald-500/20 border border-emerald-500/40 text-emerald-300':'bg-slate-900/50 text-slate-400'}">A. ${s.pilihan_a}</div>
                                <div class="p-2 rounded-lg ${kArr.includes('B')?'bg-emerald-500/20 border border-emerald-500/40 text-emerald-300':'bg-slate-900/50 text-slate-400'}">B. ${s.pilihan_b}</div>
                                ${s.pilihan_c !== '-' && s.pilihan_c !== '' ? `<div class="p-2 rounded-lg ${kArr.includes('C')?'bg-emerald-500/20 border border-emerald-500/40 text-emerald-300':'bg-slate-900/50 text-slate-400'}">C. ${s.pilihan_c}</div>` : ''}
                                ${s.pilihan_d !== '-' && s.pilihan_d !== '' ? `<div class="p-2 rounded-lg ${kArr.includes('D')?'bg-emerald-500/20 border border-emerald-500/40 text-emerald-300':'bg-slate-900/50 text-slate-400'}">D. ${s.pilihan_d}</div>` : ''}
                            </div></div></div>`;
                    });
                    html += `</div>`;
                }
            }
            container.innerHTML = html;
        };

        window.toggleKunciUI = function(prefix) {
            const jenis = document.getElementById(`${prefix}-jenis`).value;
            const containerPg = document.getElementById(`${prefix}-container-pg`);
            const containerPgk = document.getElementById(`${prefix}-container-pgk`);
            const containerBs = document.getElementById(`${prefix}-container-bs`);
            const wrapC = document.getElementById(`wrap-${prefix}-pilihan-c`);
            const wrapD = document.getElementById(`wrap-${prefix}-pilihan-d`);

            if (jenis === 'PGK') {
                if(containerPg) containerPg.classList.add('hidden');
                if(containerPgk) containerPgk.classList.remove('hidden');
                if(containerBs) containerBs.classList.add('hidden');
                if(wrapC) wrapC.classList.remove('hidden');
                if(wrapD) wrapD.classList.remove('hidden');
            } else if (jenis === 'BS') {
                if(containerPg) containerPg.classList.add('hidden');
                if(containerPgk) containerPgk.classList.add('hidden');
                if(containerBs) containerBs.classList.remove('hidden');
                document.getElementById(`${prefix}-pilihan-a`).value = 'Benar';
                document.getElementById(`${prefix}-pilihan-b`).value = 'Salah';
                if(wrapC) wrapC.classList.add('hidden');
                if(wrapD) wrapD.classList.add('hidden');
            } else { // PG
                if(containerPg) containerPg.classList.remove('hidden');
                if(containerPgk) containerPgk.classList.add('hidden');
                if(containerBs) containerBs.classList.add('hidden');
                if(wrapC) wrapC.classList.remove('hidden');
                if(wrapD) wrapD.classList.remove('hidden');
            }
        };

        window.toggleAllSoal = function(e) { document.querySelectorAll('.chk-soal').forEach(chk => chk.checked = e.target.checked); window.updateBtnHapusSoalTerpilih(); };
        window.updateBtnHapusSoalTerpilih = function() {
            const count = document.querySelectorAll('.chk-soal:checked').length;
            const btn = document.getElementById('btn-hapus-soal');
            if (btn) { if (count > 0) { btn.classList.remove('hidden'); document.getElementById('count-soal-terpilih').innerText = count; } else { btn.classList.add('hidden'); } }
        };
        
        window.hapusSoalTerpilih = function() {
            const checked = document.querySelectorAll('.chk-soal:checked'); if (checked.length === 0) return;
            window.showConfirm(`Hapus ${checked.length} soal terpilih?`, () => {
                const ids = Array.from(checked).map(chk => chk.value);
                window.appData.soal = window.appData.soal.filter(s => !ids.includes(s.id));
                window.saveLocalData('soal'); 
                window.loadManajemenSoal(window.currentFilterTingkat, true, window.currentFilterMapel); 
            });
        };
        window.hapusSemuaSoalMapel = function(mapel) { window.showConfirm(`Kosongkan folder ${mapel}?`, () => { window.appData.soal = window.appData.soal.filter(s => s.mapel !== mapel); window.saveLocalData('soal'); window.loadManajemenSoal(window.currentFilterTingkat, true, 'semua'); }); };
        window.hapusSoal = function(id) { window.showConfirm("Hapus soal?", () => { window.appData.soal = window.appData.soal.filter(x => x.id !== id); window.saveLocalData('soal'); window.loadManajemenSoal(window.currentFilterTingkat, true, window.currentFilterMapel); }); };

        window.simpanSoal = function(e) {
            e.preventDefault();
            const jenis = document.getElementById('s-jenis').value;
            let kunci = '';
            let pilihan_a = document.getElementById('s-pilihan-a').value;
            let pilihan_b = document.getElementById('s-pilihan-b').value;
            let pilihan_c = document.getElementById('s-pilihan-c').value;
            let pilihan_d = document.getElementById('s-pilihan-d').value;

            if (jenis === 'PG') { kunci = document.getElementById('s-kunci').value; } 
            else if (jenis === 'BS') { 
                kunci = document.getElementById('s-kunci-bs').value; 
                pilihan_a = 'Benar'; pilihan_b = 'Salah'; pilihan_c = '-'; pilihan_d = '-'; 
            }
            else { const chks = document.querySelectorAll('.s-kunci-pgk:checked'); kunci = Array.from(chks).map(c => c.value).join(','); }
            if(!kunci) return window.showNotification("Pilih Kunci Jawaban!");

        window.downloadExcelTemplateSoal = function() {
            const data = [{ jenis: "PG", tingkat: "7", mapel: "Bahasa Indonesia", pertanyaan: "Contoh soal", pilihan_a: "A", pilihan_b: "B", pilihan_c: "C", pilihan_d: "D", kunci: "A", skor: 2 }];
            const ws = XLSX.utils.json_to_sheet(data); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Template"); XLSX.writeFile(wb, "Template_Soal.xlsx");
        };

        window.handleExcelImportSoal = async function(e) {
            const file = e.target.files[0]; if(!file) return; const reader = new FileReader();
            reader.onload = async function(evt) {
                try {
                    const data = new Uint8Array(evt.target.result); const workbook = XLSX.read(data, {type: 'array'});
                    const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                    let count = 0;
                    for(let r of rows) { 
                        // Normalisasi ke huruf kecil agar sistem kebal jika Excel menggunakan awalan Huruf Besar
                        const rowData = {}; 
                        for (let key in r) rowData[key.toLowerCase().trim()] = r[key]; 
                        
                        const pertanyaan = String(rowData.pertanyaan||'').trim();
                        if (!pertanyaan) continue; // Lewati baris kosong
                        
                        const newSoal = { 
                            id: window.generateId(), 
                            jenis: String(rowData.jenis||'PG').toUpperCase(), 
                            tingkat: String(rowData.tingkat||'7'), 
                            mapel: String(rowData.mapel||'Umum').trim(), 
                            pertanyaan: pertanyaan, 
                            pilihan_a: String(rowData.pilihan_a||''), 
                            pilihan_b: String(rowData.pilihan_b||''), 
                            pilihan_c: String(rowData.pilihan_c||''), 
                            pilihan_d: String(rowData.pilihan_d||''), 
                            kunci: String(rowData.kunci||'A').toUpperCase(), 
                            skor: parseInt(rowData.skor||2) 
                        };
                        window.appData.soal.push(newSoal); 
                        count++;
                    }
                    if (count > 0) {
                        await window.saveLocalData('soal'); // Tunggu sinkronisasi Supabase selesai
                        window.showNotification(`Berhasil import ${count} soal baru!`); 
                        window.loadManajemenSoal('semua', true, 'semua');
                    } else { 
                        window.showNotification('Gagal: Format kolom tidak sesuai atau data kosong!'); 
                    }
                } catch(err) { 
                    window.showNotification('Gagal membaca file Excel!'); 
                    console.error(err); 
                }
                
                // Reset form file agar file yang sama bisa di-import lagi setelah diedit
                document.getElementById('excel-soal-input').value = ''; 
            }; 
            reader.readAsArrayBuffer(file);
        };

            let data = window.appData.jadwal; let html = '';
            if(data.length === 0) { html = `<div class="glass-card-dark p-6 rounded-2xl text-center text-slate-500 text-[11px] font-medium">Belum ada jadwal.</div>`; }

        window.updateRuangBA = function() {

            let options = ''; const allRooms = [];

            allRooms.forEach(r => {

                const label = disabled ? `${r} (Sudah Dikirim)` : r;

            });
            selectRuang.innerHTML = options;
        };

        window.initSignatureCanvas = function() {
            const canvas = document.getElementById('signature-canvas'); if(!canvas) return;
            const ctx = canvas.getContext('2d');
            
            // Fill white background for correct printing visibility
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            let isDrawing = false; let lastX = 0; let lastY = 0; window.isCanvasSigned = false;

            function getPos(e) {
                const rect = canvas.getBoundingClientRect(); const scaleX = canvas.width / rect.width; const scaleY = canvas.height / rect.height;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX; const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
            }

            function start(e) { e.preventDefault(); isDrawing = true; window.isCanvasSigned = true; const pos = getPos(e); lastX = pos.x; lastY = pos.y; }
            function draw(e) {
                if(!isDrawing) return; e.preventDefault(); const pos = getPos(e);
                ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(pos.x, pos.y);
                ctx.strokeStyle = '#000000'; // Black ink for printing
                ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.stroke();
                lastX = pos.x; lastY = pos.y;
            }
            function end(e) { if(!isDrawing) return; e.preventDefault(); isDrawing = false; }

            canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', end); canvas.addEventListener('mouseout', end);
            canvas.addEventListener('touchstart', start, {passive: false}); canvas.addEventListener('touchmove', draw, {passive: false});
            canvas.addEventListener('touchend', end);
        };

        window.clearSignature = function() {
            const canvas = document.getElementById('signature-canvas');
            if(canvas) { 
                const ctx = canvas.getContext('2d'); 
                ctx.fillStyle = '#ffffff'; 
                ctx.fillRect(0, 0, canvas.width, canvas.height); 
                window.isCanvasSigned = false; 
            }
        };

        window.submitBeritaAcara = function(e) {
            e.preventDefault();
            if (!window.isCanvasSigned) { window.showNotification('⚠️ Tanda tangan tidak boleh kosong!'); return; }

            const mapel = document.getElementById('ba-mapel').value;
            const catatan = document.getElementById('ba-catatan').value;
            const tanggal = document.getElementById('ba-tanggal').value;
            const ruang = document.getElementById('ba-ruang').value;
            const hadir = document.getElementById('ba-hadir').value;
            const sakit = document.getElementById('ba-sakit').value;
            const izin = document.getElementById('ba-izin').value;
            const alpa = document.getElementById('ba-alpa').value;

            const chks = document.querySelectorAll('.chk-absen:checked');
            const siswa_absen = Array.from(chks).map(c => c.value).join(', ');

            const canvas = document.getElementById('signature-canvas');
            const ttdDataUrl = canvas.toDataURL('image/png');

            const newData = { id: window.generateId(), ruang, tanggal, mapel, pengawas: window.currentUser.nama, catatan: catatan || 'Nihil', hadir, sakit, izin, alpa, siswa_absen, ttd: ttdDataUrl };
            window.appData.beritaAcara.push(newData); window.saveLocalData('beritaAcara'); 
            window.showNotification('Berita Acara Berhasil Dikirim!'); 
            
            document.getElementById('ba-catatan').value = '';
            document.getElementById('ba-hadir').value = '';

        // NEW: PREVIEW IMAGE FUNCTION FOR PROFIL
        window.previewImage = function(input, imgId, hiddenId) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 250;
                    let scaleSize = 1;
                    if (img.width > MAX_WIDTH) { scaleSize = MAX_WIDTH / img.width; }
                    canvas.width = img.width * scaleSize;
                    canvas.height = img.height * scaleSize;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    const dataUrl = canvas.toDataURL('image/png');
                    document.getElementById(imgId).src = dataUrl;
                    document.getElementById(hiddenId).value = dataUrl;
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        };

                        <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-700"><h3 class="font-bold text-white mb-1">2. Patuhi Panduan Gambar (Gunakan Hosting Luar)</h3><p>Pastikan SEMUA gambar soal/jawaban di-hosting di tempat gratis seperti postimages.org (lihat panduan di bawah). Ini menjaga agar kuota Bandwidth (lalu lintas data) 5GB bulanan Supabase Anda tidak cepat habis.</p></div>
                        <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-700"><h3 class="font-bold text-white mb-1">3. "Panaskan" Server pada H-1 Ujian</h3><p>Supabase gratis otomatis "tidur" jika project tidak diakses 7 hari. Buka dasbor Supabase H-1 ujian. Jika statusnya <i>Paused</i>, cukup klik <i>Restore</i>.</p></div>
                    </div>
                </div>
                
                <div class="glass-card-dark p-6 rounded-3xl border border-slate-800 space-y-4">
                    <h2 class="text-base font-bold text-emerald-400 font-heading tracking-tight"><i class="fa-solid fa-image mr-2"></i>Panduan Menyisipkan Gambar</h2>
                    <div class="text-[11px] text-slate-300 space-y-3 leading-relaxed">
                        <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-700"><h3 class="font-bold text-white mb-1">Langkah 1: Dapatkan Tautan (URL) Gambar</h3><p>Unggah gambar Anda ke <i>postimages.org</i>, <i>imgbb.com</i>, atau Blogger. Salin <b>Direct Link</b> (berakhiran .jpg/.png).</p></div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-700"><h3 class="font-bold text-white mb-2">Langkah 2: Sisipkan di Kolom Soal</h3><p class="mb-2">Tempelkan kode ini di akhir kalimat pada Form Pertanyaan:</p><code class="block text-[9.5px] font-mono bg-slate-950 p-2.5 rounded-xl text-emerald-400 border border-emerald-500/20 break-all">&lt;br&gt;&lt;img src="TAUTAN_GAMBAR.jpg" style="max-width:100%; border-radius:8px; margin-top:8px;"&gt;</code></div>
                            <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-700"><h3 class="font-bold text-white mb-2">Langkah 3: Sisipkan di Pilihan Jawaban</h3><p class="mb-2">Tempel kode ini di kolom isian jawaban A/B/C/D (hapus teks aslinya):</p><code class="block text-[9.5px] font-mono bg-slate-950 p-2.5 rounded-xl text-sky-400 border border-sky-500/20 break-all">&lt;img src="TAUTAN_JAWABAN.jpg" style="max-height:80px; border-radius:4px;"&gt;</code></div>
                        </div>
                    </div>
