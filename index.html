        document.addEventListener('contextmenu', event => {
            if (window.currentUser && window.currentUser.role === 'admin') return true;

        // FITUR NAVIGASI KEYBOARD LENGKAP UNTUK ADMIN
        document.addEventListener('keydown', function(e) {
            if (window.currentUser && window.currentUser.role === 'admin') {
                const activeEl = document.activeElement;
                const activeTag = activeEl ? activeEl.tagName.toLowerCase() : '';
                const isInputActive = ['input', 'select', 'textarea'].includes(activeTag);

                // 1. MODAL SHORTCUTS (ENTER = YA, ESCAPE = BATAL/TUTUP)
                const confirmModal = document.getElementById('confirm-modal');
                if (confirmModal && !confirmModal.classList.contains('hidden')) {
                    if (e.key === 'Enter') { e.preventDefault(); document.getElementById('confirm-btn-ok').click(); return; }
                    if (e.key === 'Escape') { e.preventDefault(); document.getElementById('confirm-btn-cancel').click(); return; }
                }
                const appModal = document.getElementById('app-modal');
                if (appModal && !appModal.classList.contains('hidden') && e.key === 'Escape') {
                    appModal.classList.add('hidden'); return;
                }

                if (!isInputActive) {
                    // PANAH ATAS BAWAH: Berpindah Antar Menu Utama Admin (Sidebar)
                    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                        const menuItems = Array.from(document.querySelectorAll('.admin-nav-item'));
                        const activeMenuIndex = menuItems.findIndex(btn => btn.classList.contains('bg-indigo-600'));
                        
                        if (activeMenuIndex !== -1) {
                            if (e.key === 'ArrowDown' && activeMenuIndex < menuItems.length - 1) {
                                e.preventDefault();
                                menuItems[activeMenuIndex + 1].click();
                            } else if (e.key === 'ArrowUp' && activeMenuIndex > 0) {
                                e.preventDefault();
                                menuItems[activeMenuIndex - 1].click();
                            }
                        }
                    }
                    
                    // PANAH KIRI KANAN: Berpindah Antar Tab Sub-Menu
                    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                        const tabContainers = document.querySelectorAll('.overflow-x-auto');
                        tabContainers.forEach(container => {
                            const tabButtons = Array.from(container.querySelectorAll('button'));
                            const activeBtnIndex = tabButtons.findIndex(btn => btn.classList.contains('bg-indigo-600') && btn.classList.contains('text-white'));
                            
                            if (activeBtnIndex !== -1) {
                                if (e.key === 'ArrowRight' && activeBtnIndex < tabButtons.length - 1) {
                                    e.preventDefault();
                                    tabButtons[activeBtnIndex + 1].click();
                                } else if (e.key === 'ArrowLeft' && activeBtnIndex > 0) {
                                    e.preventDefault();
                                    tabButtons[activeBtnIndex - 1].click();
                                }
                            }
                        });
                    }
                } else {
                    // TOMBOL ENTER & PANAH (Di Dalam Form): Melompat antar input isian seperti fungsi TAB
                    if (e.key === 'Enter' || e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                        if (activeTag === 'textarea' && e.key === 'Enter') return; // Biarkan native enter (baris baru) di textarea bekerja
                        if (activeTag === 'select' && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) return; // Biarkan native scroll bekerja
                        
                        const form = activeEl.closest('form');
                        if (form) {
                            const inputs = Array.from(form.querySelectorAll('input:not([type="hidden"]), select, textarea, button[type="submit"]'));
                            const index = inputs.indexOf(activeEl);
                            
                            if ((e.key === 'Enter' || e.key === 'ArrowDown') && index > -1 && index < inputs.length - 1) {
                                e.preventDefault();
                                inputs[index + 1].focus();
                            } else if (e.key === 'ArrowUp' && index > 0) {
                                e.preventDefault();
                                inputs[index - 1].focus();
                            }
                        }
                    }
                }
            }

            // BLOKIR SHORTCUT INSPECT ELEMENT UNTUK SISWA
            if (!window.currentUser || window.currentUser.role !== 'admin') {
                if(e.keyCode === 123) { e.preventDefault(); return false; } // F12
                if(e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) { e.preventDefault(); return false; } // Ctrl+Shift+I / J
                if(e.ctrlKey && e.keyCode === 85) { e.preventDefault(); return false; } // Ctrl+U
            }

        window.handleSiswaLogin = async function(e) {
            e.preventDefault(); 
            const username = document.getElementById('siswa-nomor').value.trim();
            const password = document.getElementById('siswa-password').value.trim();
            
            const btnSubmit = e.target.querySelector('button[type="submit"]'); 
            const originalHtml = btnSubmit.innerHTML;
            
            // CEK STATUS SERVER
            if (SERVER_STATUS === 'offline') {
                showNotification('MOHON MAAF! Server ujian saat ini sedang OFFLINE (Dimatikan oleh Admin).');
                return;
            }

            btnSubmit.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Memeriksa Data...'; 
            btnSubmit.disabled = true;

            try {
                const { data: foundPeserta, error } = await getDb().from('peserta').select('*').eq('username', username).maybeSingle();

                if (error) throw error;
                if (!foundPeserta) { showNotification('Username tidak ditemukan di Database!'); btnSubmit.innerHTML = originalHtml; btnSubmit.disabled = false; return; }
                
                const dbPassword = foundPeserta.password;
                if (dbPassword) {
                    if (password !== dbPassword) { showNotification('Password salah!'); btnSubmit.innerHTML = originalHtml; btnSubmit.disabled = false; return; }
                } else {
                    if (password !== "123456" && password !== username) { showNotification('Password salah! (Gunakan 123456)'); btnSubmit.innerHTML = originalHtml; btnSubmit.disabled = false; return; }
                }

                if (String(foundPeserta.status_blokir || 'AKTIF').toUpperCase() === 'BLOKIR') { showNotification('AKUN ANDA DIBLOKIR! Silakan hubungi pengawas.'); btnSubmit.innerHTML = originalHtml; btnSubmit.disabled = false; return; }

                window.currentUser = { nomor: username, nama: foundPeserta.nama, tingkat: foundPeserta.tingkat, kelas: foundPeserta.kelas, role: 'siswa' };
                sessionStorage.setItem('cbt_session', JSON.stringify(window.currentUser));
                window.violationCount = 0; window.loadSiswaSelectMapelView();
            } catch (err) { 
                showNotification('Gagal koneksi ke Server Supabase. Pastikan RLS mati atau internet stabil.'); 
                console.error(err);
            } finally { 
                btnSubmit.innerHTML = originalHtml; btnSubmit.disabled = false; 
            }
        }

        window.toggleJenisSoal = function(prefix) {
            const jenisEl = document.getElementById(prefix + '-jenis');
            if(!jenisEl) return;
            const jenis = jenisEl.value;
            const containerCD = document.getElementById(prefix + '-container-cd');
            const inpA = document.getElementById(prefix + '-pilihan-a');
            const inpB = document.getElementById(prefix + '-pilihan-b');
            const inpC = document.getElementById(prefix + '-pilihan-c');
            const inpD = document.getElementById(prefix + '-pilihan-d');
            const selKunci = document.getElementById(prefix + '-kunci');

            if (jenis === 'BS') {
                inpA.value = 'Benar'; inpA.readOnly = true; inpA.classList.add('opacity-70');
                inpB.value = 'Salah'; inpB.readOnly = true; inpB.classList.add('opacity-70');
                if(containerCD) containerCD.classList.add('hidden');
                if(inpC) inpC.value = '-'; if(inpD) inpD.value = '-';
                
                // Batasi pilihan Kunci Jawaban hanya A dan B
                Array.from(selKunci.options).forEach(opt => {
                    if(opt.value === 'C' || opt.value === 'D') opt.style.display = 'none';
                });
                if(selKunci.value === 'C' || selKunci.value === 'D') selKunci.value = 'A';
            } else {
                inpA.readOnly = false; inpA.classList.remove('opacity-70');
                inpB.readOnly = false; inpB.classList.remove('opacity-70');
                if(inpA.value === 'Benar') inpA.value = '';
                if(inpB.value === 'Salah') inpB.value = '';
                if(containerCD) containerCD.classList.remove('hidden');
                if(inpC && inpC.value === '-') inpC.value = '';
                if(inpD && inpD.value === '-') inpD.value = '';
                
                Array.from(selKunci.options).forEach(opt => opt.style.display = 'block');
            }
        };

        window.loadManajemenSoal = function(filterTingkat = 'semua', forceRefresh = false) {
            window.currentRoute = 'soal'; window.currentFilterTingkat = filterTingkat;
            const needsFetch = !window.appData.isFetched.soal || forceRefresh;
            
            if (needsFetch) {
                window.renderSoalUI([], filterTingkat, true);
                getDb().from('soal').select('*').then(({ data, error }) => {
                    if (error) { 
                        window.showNotification("Gagal memuat soal: " + error.message); 
                        window.renderSoalUI(window.appData.soal, filterTingkat, false); 
                        return; 
                    }
                    window.appData.soal = data || []; window.appData.isFetched.soal = true;
                    if (window.currentRoute === 'soal') {
                        let filtered = filterTingkat === 'semua' ? window.appData.soal : window.appData.soal.filter(s => String(s.tingkat) === filterTingkat);
                        window.renderSoalUI(filtered, filterTingkat, false);
                    }
                }).catch(err => { 
                    window.showNotification("Koneksi terputus!"); 
                    window.renderSoalUI(window.appData.soal, filterTingkat, false); 
                });
            } else {
                let filtered = filterTingkat === 'semua' ? window.appData.soal : window.appData.soal.filter(s => String(s.tingkat) === filterTingkat);
                window.renderSoalUI(filtered, filterTingkat, false);
            }
        };

        window.handleExcelImportSoal = function(e) {
            const file = e.target.files[0]; if(!file) return;
            const fileName = file.name.toLowerCase();
            const reader = new FileReader();

            if (fileName.endsWith('.json')) {
                reader.onload = async function(evt) {
                    try {
                        const rows = JSON.parse(evt.target.result);
                        if(!Array.isArray(rows) || rows.length === 0) { showNotification("File JSON kosong atau format salah!"); return; }
                        showNotification(`Memproses import ${rows.length} soal dari JSON...`);
                        for(let r of rows) {
                            const tk = String(r.tingkat||'7');
                            await getDb().from('soal').insert([{ tingkat: tk, mapel: String(r.mapel||'Umum'), pertanyaan: String(r.pertanyaan||''), pilihan_a: String(r.pilihan_a||''), pilihan_b: String(r.pilihan_b||''), pilihan_c: String(r.pilihan_c||''), pilihan_d: String(r.pilihan_d||''), kunci: String(r.kunci||'A').toUpperCase(), skor: parseInt(r.skor||2) }]);
                        }
                        showNotification("Import Soal Berhasil!"); window.loadManajemenSoal(window.currentFilterTingkat, true);
                    } catch(err) { showNotification("Gagal import file JSON: " + err.message); }
                };
                reader.readAsText(file);
            } else {
                reader.onload = async function(evt) {
                    try {
                        const data = new Uint8Array(evt.target.result); const workbook = XLSX.read(data, {type: 'array'});
                        const sheet = workbook.Sheets[workbook.SheetNames[0]]; const rows = XLSX.utils.sheet_to_json(sheet);
                        if(rows.length === 0) { showNotification("File Excel kosong!"); return; }
                        showNotification(`Memproses import ${rows.length} soal...`);
                        for(let r of rows) {
                            const tk = String(r.tingkat||'7');
                            await getDb().from('soal').insert([{ tingkat: tk, mapel: String(r.mapel||'Umum'), pertanyaan: String(r.pertanyaan||''), pilihan_a: String(r.pilihan_a||''), pilihan_b: String(r.pilihan_b||''), pilihan_c: String(r.pilihan_c||''), pilihan_d: String(r.pilihan_d||''), kunci: String(r.kunci||'A').toUpperCase(), skor: parseInt(r.skor||2) }]);
                        }
                        showNotification("Import Soal Berhasil!"); window.loadManajemenSoal(window.currentFilterTingkat, true);
                    } catch(err) { showNotification("Gagal import file Excel!"); }
                };
                reader.readAsArrayBuffer(file);
            }
        };

                    });

            if (!window.appData.isFetched.jadwal || forceRefresh) {

            }

            window.examQuestions = soalList; window.currentQuestionIndex = 0; window.studentAnswers = {}; window.studentRagu = {}; window.isExamActive = true; window.violationCount = 0;
            const jadwalItem = window.appData.jadwal.find(j => j.mapel === window.currentUser.mapel) || {};
            window.examRemainingSeconds = parseInt(jadwalItem.durasi || 90) * 60;

            renderCBTExamInterface(); startExamTimer();
        };

        function renderCBTExamInterface() {
            window.currentRoute = 'siswa-exam'; const container = document.getElementById('content-container');
            const q = window.examQuestions[window.currentQuestionIndex]; const qNum = window.currentQuestionIndex + 1; const totalQ = window.examQuestions.length;
            const curAns = window.studentAnswers[q.id] || ''; const isRagu = !!window.studentRagu[q.id];

            let navButtons = '';
            window.examQuestions.forEach((sq, idx) => {
                const ans = window.studentAnswers[sq.id]; const ragu = window.studentRagu[sq.id];
                let btnStyle = 'bg-slate-800/80 text-slate-300 border-slate-700';
                if (idx === window.currentQuestionIndex) btnStyle = 'bg-indigo-600 text-white font-black ring-2 ring-indigo-400';
                else if (ragu) btnStyle = 'bg-amber-500 text-slate-950 font-bold';
                else if (ans) btnStyle = 'bg-emerald-600 text-white font-bold';
                navButtons += `<button onclick="window.jumpToQuestion(${idx})" class="w-10 h-10 rounded-xl text-xs flex items-center justify-center transition border ${btnStyle} hover:brightness-110 shadow-sm">${idx+1}</button>`;
            });

            container.innerHTML = `
                <div class="space-y-4">
                    <div class="glass-card-dark p-4 rounded-2xl border border-slate-800 flex flex-wrap justify-between items-center gap-4 shadow-lg">
                        <div class="flex items-center space-x-3"><div class="w-10 h-10 bg-indigo-600/20 text-indigo-400 rounded-xl flex items-center justify-center font-bold text-lg border border-indigo-500/30"><i class="fa-solid fa-file-pen"></i></div><div><h3 class="font-extrabold text-white text-sm font-heading">${window.currentUser.mapel}</h3><p class="text-[10px] text-slate-400 uppercase tracking-wider">${window.currentUser.nama} (${window.currentUser.kelas})</p></div></div>
                        <div class="flex items-center space-x-3"><div id="exam-timer-badge" class="px-4 py-2 bg-slate-900 border border-slate-700 rounded-xl font-mono text-sm font-extrabold text-amber-400 flex items-center space-x-2"><i class="fa-regular fa-clock animate-pulse"></i><span id="timer-display">--:--:--</span></div><button onclick="window.confirmSelesaiUjian()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-xs uppercase tracking-wider transition shadow-lg"><i class="fa-solid fa-check-circle mr-1"></i> Selesai Ujian</button></div>
                    </div>
                    <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
                        <div class="lg:col-span-3 space-y-4">
                            <div class="glass-card-dark p-6 rounded-3xl border border-slate-800 space-y-6 shadow-xl">
                                <div class="flex justify-between items-center border-b border-slate-800 pb-3"><span class="text-xs font-bold text-indigo-400 uppercase tracking-widest">Soal No. <b class="text-lg text-white font-black">${qNum}</b> dari ${totalQ}</span><label class="flex items-center space-x-2 cursor-pointer bg-slate-900 px-3 py-1.5 rounded-xl border border-slate-800 text-xs text-amber-400 font-bold transition hover:bg-slate-800"><input type="checkbox" onchange="window.toggleRaguRagu(this)" ${isRagu?'checked':''} class="accent-amber-500 w-4 h-4 rounded"><span>Ragu-Ragu</span></label></div>
                                <div class="text-slate-100 text-sm md:text-base leading-relaxed font-medium">${q.pertanyaan}</div>
                                <div class="space-y-2.5 pt-2">
                                    ${['A','B','C','D'].map(optKey => {
                                        const optVal = q[`pilihan_${optKey.toLowerCase()}`]; if (!optVal || optVal === '-') return ''; const isSelected = curAns === optKey;
                                        return `<button onclick="window.selectAnswer('${q.id}', '${optKey}')" class="w-full text-left p-4 rounded-2xl transition border flex items-center space-x-3 ${isSelected ? 'bg-indigo-600/30 border-indigo-500 text-white shadow-md' : 'bg-slate-900/60 border-slate-800 text-slate-300 hover:bg-slate-800'}"><span class="w-8 h-8 rounded-xl ${isSelected ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400'} flex items-center justify-center font-bold text-xs shrink-0">${optKey}</span><span class="text-xs md:text-sm font-semibold">${optVal}</span></button>`;
                                    }).join('')}
                                </div>
                            </div>
                            <div class="flex justify-between items-center gap-3"><button onclick="window.prevQuestion()" ${qNum===1?'disabled':''} class="px-5 py-3.5 bg-slate-800 disabled:opacity-40 hover:bg-slate-700 text-white font-bold rounded-xl text-xs uppercase tracking-wider transition shadow-md"><i class="fa-solid fa-arrow-left mr-1"></i> Sebelum</button><button onclick="window.nextQuestion()" ${qNum===totalQ?'disabled':''} class="px-5 py-3.5 gradient-btn disabled:opacity-40 text-white font-bold rounded-xl text-xs uppercase tracking-wider transition shadow-lg">Berikut <i class="fa-solid fa-arrow-right ml-1"></i></button></div>
                        </div>
                        <div class="lg:col-span-1"><div class="glass-card-dark p-5 rounded-3xl border border-slate-800 space-y-4 shadow-xl"><h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider border-b border-slate-800 pb-2 font-heading">Navigasi Soal</h4><div class="grid grid-cols-5 gap-2 max-h-[60vh] overflow-y-auto pr-1">${navButtons}</div></div></div>
                    </div>
                </div>
            `;
            updateTimerDisplay();
        }

        window.jumpToQuestion = function(idx) { window.currentQuestionIndex = idx; renderCBTExamInterface(); };
        window.prevQuestion = function() { if (window.currentQuestionIndex > 0) { window.currentQuestionIndex--; renderCBTExamInterface(); } };
        window.nextQuestion = function() { if (window.currentQuestionIndex < window.examQuestions.length - 1) { window.currentQuestionIndex++; renderCBTExamInterface(); } };
        window.selectAnswer = function(qId, key) { window.studentAnswers[qId] = key; renderCBTExamInterface(); };
        window.toggleRaguRagu = function(chk) { const q = window.examQuestions[window.currentQuestionIndex]; window.studentRagu[q.id] = chk.checked; renderCBTExamInterface(); };

        function startExamTimer() {
            if (window.examTimerInterval) clearInterval(window.examTimerInterval);
            window.examTimerInterval = setInterval(() => {
                if (window.examRemainingSeconds > 0) { window.examRemainingSeconds--; updateTimerDisplay(); } 
                else { clearInterval(window.examTimerInterval); showNotification("Waktu Ujian Habis!"); window.submitFinalAnswers(); }
            }, 1000);
        }

        function updateTimerDisplay() {
            const disp = document.getElementById('timer-display'); if (!disp) return;
            const h = String(Math.floor(window.examRemainingSeconds / 3600)).padStart(2, '0'); const m = String(Math.floor((window.examRemainingSeconds % 3600) / 60)).padStart(2, '0'); const s = String(window.examRemainingSeconds % 60).padStart(2, '0');
            disp.innerText = `${h}:${m}:${s}`;
        }

        window.confirmSelesaiUjian = function() {
            const answeredCount = Object.keys(window.studentAnswers).length; const total = window.examQuestions.length;
            window.showConfirm(`Anda telah menjawab ${answeredCount} dari ${total} soal. Yakin ingin mengakhiri ujian ini?`, () => { window.submitFinalAnswers(); });
        };

        window.submitFinalAnswers = async function() {
            window.isExamActive = false; if (window.examTimerInterval) clearInterval(window.examTimerInterval);
            let totalSkor = 0; let maxSkor = 0;
            window.examQuestions.forEach(q => {
                const sKey = window.studentAnswers[q.id]; const itemSkor = parseInt(q.skor || 2); maxSkor += itemSkor;
                if (sKey && sKey.toUpperCase() === String(q.kunci).toUpperCase()) totalSkor += itemSkor;
            });
            const finalNilai = maxSkor > 0 ? Math.round((totalSkor / maxSkor) * 100) : 0;

            try { await getDb().from('hasil').insert([{ nama: window.currentUser.nama, kelas: window.currentUser.kelas, tingkat: window.currentUser.tingkat, mapel: window.currentUser.mapel, nilai: finalNilai, waktu: new Date().toISOString() }]); } catch(e) {}

            const container = document.getElementById('content-container');
            container.innerHTML = `
                <div class="glass-card-dark p-8 md:p-12 rounded-3xl text-center max-w-lg mx-auto space-y-6 mt-10 border border-emerald-500/50 shadow-[0_0_50px_rgba(16,185,129,0.2)]">
                    <div class="w-24 h-24 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mx-auto text-4xl shadow-xl border border-emerald-500/30"><i class="fa-solid fa-circle-check"></i></div>
                    <div><h2 class="text-2xl font-black text-white uppercase tracking-wider mb-2 font-heading">Ujian Selesai!</h2><p class="text-xs text-slate-400">Jawaban Anda telah berhasil tersimpan ke Server CBT Panesa.</p></div>
                    <div class="p-6 bg-slate-900 rounded-2xl border border-slate-800 text-center shadow-inner"><span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest block mb-1">Perolehan Nilai</span><span class="text-5xl font-black text-emerald-400 font-mono">${finalNilai}</span></div>
                    <button onclick="window.handleLogout()" class="w-full py-4 gradient-btn text-white font-extrabold rounded-xl uppercase tracking-widest text-xs transition shadow-xl hover:shadow-2xl">Selesai & Keluar Sesi</button>
                </div>
            `;
        };
    </script>
</head>

<body class="glow-bg min-h-screen flex flex-col justify-between">

                        <img id="app-logo-display" src="" class="max-w-full max-h-full object-contain mx-auto drop-shadow-[0_5px_15px_rgba(99,102,241,0.4)]">

                    <div class="inline-flex items-center px-3 py-1 mt-2 rounded-full bg-indigo-500/10 border border-indigo-500/30 text-[10px] text-indigo-300 font-extrabold uppercase tracking-[0.25em]">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping mr-2"></span> CBT Online Panesa

                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 mb-1.5 uppercase tracking-widest pl-1"><i class="fa-solid fa-key text-indigo-400 mr-1.5"></i> Password</label>
                        <div class="relative">
                            <input type="password" id="siswa-password" required class="w-full px-4 py-3.5 rounded-xl glass-input text-sm font-mono tracking-widest placeholder-slate-600 pr-12" placeholder="Password dari Kartu">
                            <button type="button" onclick="window.togglePassword('siswa-password', this)" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-indigo-400 transition" title="Tampilkan Password"><i class="fa-solid fa-eye"></i></button>
                        </div>
                    </div>
                    <div class="pt-2"><button type="submit" class="w-full py-4 gradient-btn text-white font-black rounded-xl text-[11px] uppercase tracking-[0.15em] shadow-xl shadow-indigo-600/30 flex items-center justify-center space-x-2"><span>Masuk Ujian</span> <i class="fa-solid fa-arrow-right"></i></button><div class="mt-4 text-center text-[10px] text-slate-500 font-medium tracking-widest lowercase">&copy; 2026 copyright: <span class="font-bold text-indigo-400">@Tim IT Panesa</span></div></div>

                    <div>

                        <div class="relative">
                            <input type="password" id="pengawas-password" required placeholder="••••••••" class="w-full px-4 py-3.5 rounded-xl glass-input text-sm font-mono tracking-widest pr-12">

                    <div class="pt-2"><button type="submit" class="w-full py-4 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-black rounded-xl text-[11px] uppercase tracking-[0.15em] shadow-xl shadow-emerald-600/30 transition flex items-center justify-center space-x-2"><span>Masuk Dasbor</span> <i class="fa-solid fa-arrow-right"></i></button><div class="mt-4 text-center text-[10px] text-slate-500 font-medium tracking-widest lowercase">&copy; 2026 copyright: <span class="font-bold text-indigo-400">@Tim IT Panesa</span></div></div>
                </form>

                <form id="admin-login-form" onsubmit="window.handleAdminLogin(event)" class="space-y-4 text-left hidden">

                <div class="flex items-center space-x-3"><div class="w-10 h-10 bg-slate-800 rounded-lg p-1 border border-slate-700 shadow-inner"><img id="mobile-logo-display" src="" class="max-w-full max-h-full object-contain mx-auto"></div><div><h2 class="font-black text-white text-[11px] tracking-wider font-heading">SMP NEGERI 1 PABEDILAN</h2><p id="mobile-user-role" class="text-[9px] text-emerald-400 font-bold uppercase tracking-widest mt-0.5">Role</p></div></div>
                <button onclick="window.toggleMobileSidebar()" class="text-slate-300 hover:text-white text-2xl transition"><i class="fa-solid fa-bars"></i></button>

            <div class="flex-1 flex flex-col md:flex-row h-full overflow-hidden relative">
